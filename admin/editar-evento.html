<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Editar evento | Mister Club</title><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head>
<body class="pagina-form-reserva"><main class="modal-evento-admin" aria-labelledby="titulo-editar-evento"><a class="cerrar-form-reserva" href="eventos.html" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></a><h1 id="titulo-editar-evento">Editar Evento <i class="fa-regular fa-calendar-days"></i></h1><form class="form-evento-admin" action="eventos.html"><label for="nombre-evento">Nombre del evento</label><input id="nombre-evento" type="text" required><label for="descripcion">Descripci&oacute;n</label><textarea id="descripcion" required></textarea><div class="campos-reserva-admin"><div><label for="fecha-evento">Fecha</label><input id="fecha-evento" type="date" required></div><div><label for="hora-evento">Hora</label><input id="hora-evento" type="time" required></div></div><div class="campos-reserva-admin"><div><label for="lugar-evento">Lugar</label><input id="lugar-evento" type="text" value="Mister Club" required></div><div><label for="estado-evento">Estado</label><select id="estado-evento"><option selected>Activo</option><option>Pr&oacute;ximo</option><option>Finalizado</option></select></div></div><label>Imagen actual</label><div class="imagen-actual-evento"><img src="../img/eventos/dia-padre.jpg" alt="Afiche del evento"><div><strong>Imagen del evento</strong><small>Sube una nueva imagen solo si deseas cambiarla.</small><label for="cambiar-imagen" class="cambiar-imagen">Cambiar imagen</label><input id="cambiar-imagen" type="file" accept="image/*" hidden></div></div><div class="acciones-form-reserva"><a href="eventos.html" class="cancelar-form-reserva">Cancelar</a><button type="submit"><i class="fa-regular fa-floppy-disk"></i> Actualizar Evento</button></div></form></main><script src="../js/eventos-api.js?v=2"></script></body></html>
